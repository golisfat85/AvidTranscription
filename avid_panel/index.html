<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avid Transcription</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
<div id="app">

  <header>
    <div id="server-indicator" title="Server status"></div>
    <h1>Avid Transcription</h1>
    <span id="server-label" style="font-size:10px;color:var(--text-muted)">Connecting…</span>
    <a href="http://localhost:8765" target="_blank" title="Open in browser tab"
       style="font-size:10px;color:var(--text-muted);text-decoration:none;margin-left:6px">⤢</a>
  </header>

  <div id="scroll-area">

    <!-- ── Media source ── -->
    <div class="card">
      <div class="card-title">Media Source</div>

      <div class="field">
        <label>Media file path</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="media-path" placeholder="/path/to/clip.mxf">
          <button class="btn btn-secondary btn-sm" id="btn-from-avid" title="Use clip selected in Avid bin">From Bin</button>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Audio track</label>
          <select id="audio-track">
            <option value="0">Track 1</option>
            <option value="1">Track 2</option>
            <option value="2">Track 3</option>
            <option value="3">Track 4</option>
          </select>
        </div>
        <div class="field">
          <label>Frame rate</label>
          <select id="fps">
            <option value="23.976">23.976</option>
            <option value="24">24</option>
            <option value="25" selected>25</option>
            <option value="29.97">29.97</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="59.94">59.94</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ── Transcription settings ── -->
    <div class="card">
      <div class="card-title">Transcription Settings</div>

      <div class="row">
        <div class="field">
          <label>Whisper model</label>
          <select id="model">
            <option value="tiny">tiny</option>
            <option value="base" selected>base</option>
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large-v3">large-v3</option>
          </select>
        </div>
        <div class="field">
          <label>Language</label>
          <select id="language">
            <option value="">auto-detect</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
            <option value="ru">Russian</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Task</label>
        <select id="task">
          <option value="transcribe">Transcribe</option>
          <option value="translate">Translate to English</option>
        </select>
      </div>
    </div>

    <!-- ── Output formats ── -->
    <div class="card">
      <div class="card-title">Output Formats</div>
      <div class="checks">
        <label><input type="checkbox" id="fmt-srt" checked> SRT</label>
        <label><input type="checkbox" id="fmt-vtt" checked> WebVTT</label>
        <label><input type="checkbox" id="fmt-csv"> CSV</label>
        <label><input type="checkbox" id="fmt-markers" checked> Avid Markers</label>
      </div>
    </div>

    <!-- ── Transcribe button ── -->
    <button class="btn btn-primary" id="btn-transcribe" disabled>Transcribe</button>

    <!-- ── Progress ── -->
    <div id="progress-wrap" class="card">
      <div class="card-title">Progress</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div id="progress-msg">Waiting…</div>
    </div>

    <!-- ── Transcript preview ── -->
    <div id="preview-wrap" class="card">
      <div class="card-title">Transcript Preview</div>
      <pre id="preview"></pre>
    </div>

    <!-- ── Post-transcription actions ── -->
    <div id="actions-wrap">
      <button class="btn btn-secondary btn-sm" id="btn-import-markers">Import Markers into Avid</button>
      <button class="btn btn-secondary btn-sm" id="btn-copy-srt">Copy SRT</button>
      <button class="btn btn-secondary btn-sm" id="btn-new">New Job</button>
    </div>

  </div><!-- /scroll-area -->
</div><!-- /app -->

<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
